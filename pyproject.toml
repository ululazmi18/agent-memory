[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory"
version = "0.1.0"
description = "Deterministic High-Density Memory Engine & MCP Server for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Antigravity AI Agent Team" }]
dependencies = [
    "rich>=13.0.0",
    "mcp>=2.0.0",
]

[project.scripts]
agent-memory = "agent_memory.cli:main"
agent-memory-mcp = "agent_memory.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
